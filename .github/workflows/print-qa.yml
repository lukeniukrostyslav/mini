name: Print QA

on:
  push:
    branches: [main]
    paths:
      - "products/**"
      - "tools/**"
      - ".github/workflows/print-qa.yml"
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependency
        run: pip install pillow
      - name: Validate print assets
        run: python tools/validate_print.py
