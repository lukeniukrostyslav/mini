name: Build Print Assets

on:
  push:
    branches: [main]
    paths-ignore:
      - "products/**/generated/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: pip install cairosvg
      - name: Render PNG
        run: python tools/render_product_001.py
      - name: Commit generated asset
        run: |
          git config user.name "mini-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/**/generated/
          git pull --rebase origin main
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: generate print-ready PNG asset"
            git push
          fi
