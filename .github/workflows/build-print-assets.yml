name: Build Print Assets

on:
  push:
    branches: [main]
    paths-ignore:
      - "products/**/generated/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: pip install cairosvg
      - name: Render all 20 PNG assets
        run: python tools/render_all_product_001.py
      - name: Validate all print assets
        run: pip install pillow && python tools/validate_all_print_assets.py
      - name: Create visual contact sheet
        run: python tools/create_product_001_contact_sheet.py
      - name: Upload rendered collection for QA
        uses: actions/upload-artifact@v4
        with:
          name: product-001-rendered-20
          path: products/001-caffeinated-slightly-overbooked/generated/*.png
          if-no-files-found: error
      - name: Upload contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: product-001-contact-sheet
          path: products/001-caffeinated-slightly-overbooked/generated/PRODUCT-001-CONTACT-SHEET.png
          if-no-files-found: error
      - name: Commit generated asset
        run: |
          git config user.name "mini-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/**/generated/
          git pull --rebase origin main
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: generate print-ready PNG asset"
            git push
          fi
